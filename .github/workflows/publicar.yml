name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --split-per-abi
      - name: Publicar APK en la versión "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk kipu-docente.apk
          cp app-armeabi-v7a-release.apk kipu-docente-celulares-antiguos.apk
          gh release view ultima >/dev/null 2>&1 || gh release create ultima \
            --prerelease \
            --title "Kipu Docente (última versión de prueba)" \
            --notes "APK de prueba. Descarga kipu-docente.apk; si tu celular es muy antiguo y no instala, usa kipu-docente-celulares-antiguos.apk."
          gh release upload ultima kipu-docente.apk kipu-docente-celulares-antiguos.apk --clobber
          gh release edit ultima --notes "APK de prueba (versión ${GITHUB_SHA::7}). Descarga kipu-docente.apk; si tu celular es muy antiguo y no instala, usa kipu-docente-celulares-antiguos.apk."
