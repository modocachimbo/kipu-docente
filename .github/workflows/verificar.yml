name: Verificar

# Revisa cada pull request antes de unirlo a main: que compile, que no haya
# errores de análisis y que pasen las pruebas. No publica nada.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Análisis (solo errores)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Compila la versión web
        run: flutter build web --release --no-web-resources-cdn
      # La web compilada queda 3 días para revisarla (capturas de pantalla).
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 3

  # Que el APK también compile (permisos, plugins nativos, Gradle).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Compila el APK
        run: flutter build apk --release --target-platform android-arm64
